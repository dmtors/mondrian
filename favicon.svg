<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mondrian's icon: the painting in miniature, after Broadway Boogie Woogie.
       Yellow streets of 4px squares cross a white ground, coloured squares at
       the crossings, one red block in the middle. The painting's own colours (see style.css). -->
  <defs><clipPath id="tile"><rect width="32" height="32" rx="6"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="#fff"/>
    <g fill="#f5bb1b">
      <rect x="0" y="5" width="32" height="4"/>
      <rect x="0" y="22" width="32" height="4"/>
      <rect x="5" y="0" width="4" height="32"/>
      <rect x="22" y="0" width="4" height="32"/>
    </g>
    <rect x="5" y="5" width="4" height="4" fill="#ff2b00"/>
    <rect x="22" y="5" width="4" height="4" fill="#1d5ee0"/>
    <rect x="5" y="22" width="4" height="4" fill="#1d5ee0"/>
    <rect x="22" y="22" width="4" height="4" fill="#ff2b00"/>
    <rect x="14" y="5" width="4" height="4" fill="#ede8dc"/>
    <rect x="5" y="14" width="4" height="4" fill="#ff2b00"/>
    <rect x="22" y="14" width="4" height="4" fill="#ede8dc"/>
    <rect x="14" y="22" width="4" height="4" fill="#1d5ee0"/>
    <rect x="12" y="12" width="7" height="7" fill="#ff2b00"/>
  </g>
  <rect width="31" height="31" x="0.5" y="0.5" rx="5.5" fill="none" stroke="#000" stroke-opacity="0.12"/>
</svg>
